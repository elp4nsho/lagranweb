<!doctype html>
<html lang="es" data-app="iot" data-default-theme="terminal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Sentinela</title>
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="auth-wrap"><div class="auth-card stack">
    <div class="row between" id="brand"></div>
    <form class="card stack" id="login-form" novalidate data-anim>
      <div><h1 style="font-size:30px;margin:0">Consola Sentinela</h1><p class="muted" style="margin:4px 0 0">Acuícola Fiordo · cliente demo</p></div>
      <div class="field"><label for="email">Correo</label><input class="input" id="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="pass">Clave</label><input class="input" id="pass" type="password" autocomplete="current-password"></div>
      <p class="small" id="err" style="color:var(--danger);margin:0" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>
    <section class="card stack" data-anim><div><h3 style="margin:0">Cuentas demo</h3><p class="small muted" style="margin:0">Cada rol tiene permisos distintos.</p></div><div id="demo"></div></section>
  </div></main>
  <script type="module" src="js/public/login.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
</body>
</html>
