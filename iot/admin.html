<!doctype html>
<html lang="es" data-app="iot" data-default-theme="terminal">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Sentinela</title>
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">

  <script type="module" src="js/admin/main.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
