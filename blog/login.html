<!doctype html>
<html lang="es" data-app="blog" data-default-theme="nordic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Brújula Noticias</title>
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="login-page">
    <aside class="login-aside" id="aside"></aside>
    <main class="login-main">
      <div class="login-box stack">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" aria-selected="true" data-tab="login">Iniciar sesión</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="registro">Crear cuenta</button>
        </div>
        <form class="card stack" id="login-form" novalidate>
          <div class="field"><label for="email">Correo</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="password">Contraseña</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
          <p class="small" id="login-error" role="alert" style="color:var(--danger);margin:0" hidden></p>
          <button class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        </form>
        <form class="card stack" id="register-form" novalidate hidden>
          <div class="field"><label for="r-name">Nombre</label><input class="input" id="r-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="r-email">Correo</label><input class="input" id="r-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="r-pass">Contraseña (mínimo 6 caracteres)</label><input class="input" id="r-pass" name="password" type="password" autocomplete="new-password" required minlength="6"></div>
          <label class="check small"><input type="checkbox" name="newsletter" checked> Quiero recibir el newsletter diario</label>
          <label class="check small"><input type="checkbox" name="terms" required> Acepto los términos y la política de privacidad</label>
          <p class="small" id="reg-error" role="alert" style="color:var(--danger);margin:0" hidden></p>
          <button class="btn btn-primary btn-block" id="reg-btn">Crear cuenta gratis</button>
        </form>
        <div class="stack" style="gap:8px"><span class="label">Cuentas de demostración (un clic)</span><div id="demo"></div></div>
        <p class="small muted"><a href="index.html">← Volver a la portada</a></p>
      </div>
    </main>
  </div>
  <script type="module" src="js/login.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
</body>
</html>
