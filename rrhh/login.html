<!doctype html>
<html lang="es" data-app="rrhh" data-default-theme="material">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Grupo Cordillera</title>
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="login-wrap">
    <div class="card login-card">
      <div class="stack">
        <a class="brand" href="index.html"><span class="logo" id="logo"></span><span>Grupo Cordillera</span></a>
        <div><h1 style="font-size:clamp(26px,4vw,34px)">Ingresar</h1><p class="muted">Portal del colaborador y panel de Personas (RRHH).</p></div>
        <form class="stack" id="loginForm" novalidate>
          <div class="field"><label for="email">Correo</label><input class="input" id="email" type="email" autocomplete="username" required placeholder="nombre@grupocordillera.demo"></div>
          <div class="field"><label for="pass">Contraseña</label><input class="input" id="pass" type="password" autocomplete="current-password" required></div>
          <p class="danger small" id="err" role="alert" style="margin:0"></p>
          <button class="btn btn-primary btn-block" type="submit" id="go">Ingresar</button>
        </form>
        <a href="index.html" class="small">← Volver al sitio de empleos</a>
      </div>
      <div class="login-side stack">
        <div><span class="eyebrow">Cuentas de prueba</span><h2 style="font-size:20px;margin-top:6px">Entra con un clic</h2><p class="muted small">Cada rol ve algo distinto: Admin RRHH y Reclutador usan el panel; Jefatura y Empleado, el portal de autoservicio.</p></div>
        <div id="demo"></div>
      </div>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
</body>
</html>
