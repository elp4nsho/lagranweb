<!doctype html>
<html lang="es" data-app="eventos" data-default-theme="parallax">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Tiquetera Volcán</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 21 9 8l3 4 2-3 8 12z' fill='%23e74c3c'/%3E%3C/svg%3E">
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card" data-anim>
      <div class="stack">
        <a class="brand" href="index.html" id="brand">Tiquetera Volcán</a>
        <div class="tabs" role="tablist"><button class="tab active" data-t="login" role="tab">Ingresar</button><button class="tab" data-t="register" role="tab">Crear cuenta</button></div>
        <form class="stack" id="login" novalidate>
          <div class="field"><label for="email">Correo</label><input class="input" id="email" name="email" type="email" autocomplete="username" required placeholder="tu@correo.cl"></div>
          <div class="field"><label for="pass">Contraseña</label><input class="input" id="pass" name="password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary btn-lg">Ingresar</button>
          <p class="small muted" id="err" role="alert"></p>
        </form>
        <form class="stack" id="register" hidden novalidate>
          <div class="field"><label for="rname">Nombre completo</label><input class="input" id="rname" name="name" required></div>
          <div class="field"><label for="remail">Correo</label><input class="input" id="remail" name="email" type="email" required></div>
          <div class="field"><label for="rpass">Contraseña (mín. 6)</label><input class="input" id="rpass" name="password" type="password" required minlength="6"></div>
          <button class="btn btn-primary btn-lg">Crear cuenta de cliente</button>
          <p class="small muted" id="rerr" role="alert"></p>
        </form>
        <a href="index.html" class="small">← Volver a la cartelera</a>
      </div>
      <div class="side stack">
        <div><span class="eyebrow">Demo</span><h2 style="margin:4px 0">Entra con un clic</h2><p class="muted small" style="margin:0">Cada rol abre su propia aplicación: panel admin, portal de productoras, app de control de acceso o la cuenta de cliente.</p></div>
        <div id="demo"></div>
      </div>
    </div>
  </main>
  <script type="module" src="js/public/login.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
</body>
</html>
