<!doctype html>
<html lang="es" data-app="fintech" data-default-theme="blueprint">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back-office · Cóndor Pay (demo)</title>
  <script src="../assets/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="sidebar" aria-label="Menú del back-office"></aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="btn btn-icon admin-burger" aria-label="Abrir menú">☰</button>
        <input class="input search hide-sm" type="search" id="gsearch" placeholder="Buscar cliente por nombre, RUT o correo…" aria-label="Buscar cliente">
        <div id="userbar" style="margin-left:auto"></div>
      </header>
      <main class="admin-content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="js/admin/main.js"></script>
  <script src="../assets/portfolio-bar.js" defer></script>
</body>
</html>
