# Plantilla: copia este archivo al repo del cliente como .github/workflows/deploy.yml.
# En cada push a main construye dist/<slug>/ y lo publica en Cloudflare Pages.
# Secretos del repo: CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages: Edit") y CLOUDFLARE_ACCOUNT_ID.
# Variable del repo: CLIENT_SLUG (p. ej. demo-pro) y, si usa Supabase, BACKEND=supabase.
name: Publicar sitio del cliente
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tools || npm i --prefix tools
      - name: Construir
        run: |
          if [ "${{ vars.BACKEND }}" = "supabase" ]; then
            node tools/build-client.mjs "${{ vars.CLIENT_SLUG }}" --backend=supabase
            echo "OUT=dist/${{ vars.CLIENT_SLUG }}-supabase" >> "$GITHUB_ENV"
          else
            node tools/build-client.mjs "${{ vars.CLIENT_SLUG }}"
            echo "OUT=dist/${{ vars.CLIENT_SLUG }}" >> "$GITHUB_ENV"
          fi
      - name: Publicar en Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy "$OUT" --project-name="${{ vars.CLIENT_SLUG }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
